name: Publish Docker Images

# Every push and pull request builds the lite and full flavours on both
# architectures as a check, with a token
# that can only read. Only a `v*` tag gets a token that can write to ghcr.io,
# and only that run pushes. The matrix lives once, in build-images.yml.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  check:
    name: Check
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: read
    with:
      publish: false

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true
