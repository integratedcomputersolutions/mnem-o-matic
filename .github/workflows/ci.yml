name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2

      - name: Run unit tests
        run: uv run --with pytest python -m pytest

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Build lite image
        run: docker build --target lite -t mnemomatic-test-lite .

      - name: Start server
        run: |
          docker run -d --name mnemomatic-test -p 8686:8000 \
            -e MNEMOMATIC_ADMIN_PASSWORD=ci-admin-password mnemomatic-test-lite
          timeout 30 bash -c 'until curl -fs -o /dev/null http://localhost:8686/health; do sleep 1; done'

      - name: Mint an API token
        # The real path a person takes: log in with the bootstrapped admin,
        # create a token, hand it to the test suite. Origin must match Host
        # on state-changing calls, as it would from a browser.
        run: |
          O='Origin: http://localhost:8686'; J='Content-Type: application/json'
          curl -fsS -c jar -H "$O" -H "$J" -o /dev/null \
            -d '{"username":"admin","password":"ci-admin-password"}' http://localhost:8686/api/login
          TOKEN=$(curl -fsS -b jar -H "$O" -H "$J" \
            -d '{"name":"ci","expires_in_days":1}' http://localhost:8686/api/me/tokens | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != null
          echo "::add-mask::$TOKEN"
          echo "MNEMOMATIC_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          curl -fsS -o /dev/null -H "Authorization: Bearer $TOKEN" -X POST -H "$J" \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            http://localhost:8686/mcp

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2

      - name: Run integration tests
        run: uv run --with pytest --with "mnemomatic-cli @ ./cli" python -m pytest tests/test_mcp_api.py

      - name: Stop server
        if: always()
        run: docker rm -f mnemomatic-test
