name: Build images

# The image build matrix, shared by every run of publish.yml. It is a
# reusable workflow so the caller decides what the token may do: branches and
# pull requests call it with a read-only token and `publish: false`, and only
# a release tag calls it with `packages: write` and `publish: true`. A job's
# `permissions:` cannot switch on an expression, and the per-platform builds
# themselves push (by digest) on a release, so the split has to be at the
# caller. The jobs here declare no permissions of their own: they inherit
# exactly what the caller grants.
#
# Flavours: `lite` (no ML stack) and one `full` image per published embedding
# model. The Arctic one keeps the plain `-full` suffix it always had; GTE is
# `-full-gte-multilingual-base`. The two Gemma-derived models (EmbeddingGemma,
# Amaretto) are deliberately not published: their weights carry the Gemma
# Terms of Use, and users build those images from source and accept the terms
# themselves. A check run builds only `lite` and `full`, the pair that
# exercises both Dockerfile targets; a release builds the published set.

on:
  workflow_call:
    inputs:
      publish:
        description: Push the per-platform images and the multi-platform manifests to ghcr.io
        required: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.flavor }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      # Each flavour on both architectures. The release list is the check
      # list plus the other published model. The Dockerfile target and the
      # model each flavour maps to are derived where they are used: an
      # `include` entry naming a flavour absent from the list would not
      # match any combination and would be added as a new one with no
      # platform and no runner, which fails the job before it starts.
      matrix:
        flavor: ${{ fromJSON(inputs.publish && '["lite", "full", "full-gte-multilingual-base"]' || '["lite", "full"]') }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to ghcr.io
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            suffix=-${{ matrix.flavor }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: ${{ matrix.flavor == 'lite' && 'lite' || 'full' }}
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.publish }}
          labels: ${{ steps.meta.outputs.labels }}
          # EMBED_MODEL is unused by the lite target but must still parse.
          build-args: |
            MNEMOMATIC_BUILD=${{ github.sha }}
            EMBED_MODEL=${{ matrix.flavor == 'full-gte-multilingual-base' && 'gte-multilingual-base' || 'arctic-embed-xs' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ inputs.publish }}
          # One cache per matrix leg, so the builds do not overwrite each other's.
          cache-from: type=gha,scope=${{ matrix.flavor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}-${{ matrix.arch }}

      - name: Export digest
        if: inputs.publish
        run: |
          mkdir -p /tmp/digests/${{ matrix.flavor }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.flavor }}/${digest#sha256:}"

      - name: Upload digest
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # Architecture first: the merge job globs by flavour, and a flavour
          # name that is a prefix of another's (full, full-gte-...) must not
          # match the other's artifacts.
          name: digest-${{ matrix.arch }}-${{ matrix.flavor }}
          path: /tmp/digests/${{ matrix.flavor }}
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.flavor }} manifest
    runs-on: ubuntu-latest
    if: inputs.publish
    needs: build

    strategy:
      matrix:
        flavor: [lite, full, full-gte-multilingual-base]

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: /tmp/digests/${{ matrix.flavor }}
          pattern: digest-*-${{ matrix.flavor }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            suffix=-${{ matrix.flavor }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push multi-platform manifest
        working-directory: /tmp/digests/${{ matrix.flavor }}
        run: |
          # Word splitting is the point: one -t per tag, one digest per file.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
