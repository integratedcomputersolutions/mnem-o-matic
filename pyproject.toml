[project]
name = "mnemomatic-server"
version = "2.0.0"
description = "Perfect recall for imperfect machines. A shared memory MCP server for LLMs."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2.0",
    "sqlite-vec>=0.1.6,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn>=0.20,<1.0",
    "starlette>=1.3.1,<2.0",
]

[project.optional-dependencies]
onnx = [
    # Capped below 1.29: onnxruntime 1.29.0 segfaults on `import onnxruntime`
    # under gcr.io/distroless/python3-debian12, the base both runtime images
    # use. 1.28.0 is fine there, and 1.29.0 imports fine on Debian slim, so
    # this is specific to the distroless runtime rather than to our build.
    # Raise the cap once a 1.29.x is confirmed working on that base.
    "onnxruntime>=1.20,<1.29",
    "tokenizers>=0.15",
    "numpy>=1.24,<2.0",
]

[project.scripts]
mnemomatic = "mnemomatic.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemomatic"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_mcp_api.py"
