services:
  mnemomatic:
    container_name: mnemomatic-MCP
    # To use a pre-built image instead of building locally, replace the build
    # block with the image line below (use -lite for the smaller variant):
    # image: ghcr.io/integratedcomputersolutions/mnem-o-matic:latest-full
    build:
      context: .
      target: full          # use 'lite' for the smaller image (requires MNEMOMATIC_EMBED_URL)
      # args:                                 # built-in embedding model — uncomment ONE:
      #   EMBED_MODEL: minilm                 # (default) all-MiniLM-L6-v2 — 384 dims, English, ~10-15 ms/embed, ~240 MB RAM
      #   EMBED_MODEL: gte-multilingual-base  # 768 dims, ~70 languages, ~12 ms/query embed, 8192-token context, ~880 MB RAM
      #   EMBED_MODEL: embeddinggemma         # 768 dims, best retrieval quality, ~200 ms/embed, ~1.2 GB RAM
      #                                       # switching models on an existing database needs one MNEMOMATIC_REINDEX=1 restart
    # No ports exposed directly — all traffic goes through Caddy
    # (or uncomment below for direct access: ports: ["${PORT:-8686}:8000"])
    volumes:
      - ./data:/data
    environment:
      - MNEMOMATIC_DB_PATH=/data/mnemomatic.db
      # - MNEMOMATIC_API_KEY=  # set a strong key: openssl rand -base64 32
      # - MNEMOMATIC_UI_TOKEN=  # enable the read-only web viewer at /ui; shared secret, not a user account
      # - MNEMOMATIC_BACKUP_DIR=/data/backups                       # enable scheduled export-zip backups; keep it inside the mounted volume
      # - MNEMOMATIC_BACKUP_INTERVAL=24                             # hours between backups (default: 24)
      # - MNEMOMATIC_BACKUP_KEEP=7                                  # backup archives to retain; older ones are pruned (default: 7)
      # - MNEMOMATIC_CORS_ORIGINS=*  # allow browser clients; use comma-separated origins to restrict
      # - MNEMOMATIC_EMBED_URL=http://ollama:11434/v1/embeddings    # required for lite image (OpenAI-compatible: Ollama, llama.cpp, vLLM)
      # - MNEMOMATIC_EMBED_API=openai                               # or 'ollama' for the native /api/embeddings endpoint
      # - MNEMOMATIC_EMBED_MODEL=nomic-embed-text                   # model name for external embedder
      # - MNEMOMATIC_EMBED_DIM=768                                  # embedding dimension (default: the bundled model's; 384 without one)
      # - MNEMOMATIC_REINDEX=1                                      # one-time: rebuild the vector index and re-embed all content at startup (after changing model/dim/prefixes). Remove after the run — it re-embeds on every boot while set
      # - MNEMOMATIC_CHUNK_THRESHOLD=2000                           # chars; docs longer than this are chunked (default: 2000)
      # - MNEMOMATIC_CHUNK_SIZE=1000                                # chars per chunk (default: 1000)
      # - MNEMOMATIC_CHUNK_OVERLAP=200                              # overlap between chunks in chars (default: 200)

  caddy:
    container_name: Caddy-MCP
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
    depends_on:
      - mnemomatic

volumes:
  caddy_data:
